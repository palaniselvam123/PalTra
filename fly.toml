# fly.toml app configuration file generated for paltra on 2026-09-07T11:27:35Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'paltra'
primary_region = 'sin'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[mounts]]
  source = 'data'
  destination = '/data'

   [[vm]]
     cpu_kind = 'shared'
     cpus = 2
     memory_mb = 2048
