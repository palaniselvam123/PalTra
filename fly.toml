# fly.toml app configuration file generated for paltra on 2026-09-07T11:27:35Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'paltra'
primary_region = 'sin'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[mounts]]
  source = 'data'
  destination = '/data'

# One dedicated core. The desk, both SMA bots, a replay and every API call
# share one Python event loop, so extra shared vCPUs do not help; a shared
# CPU's quota throttles a fast replay until the page cannot reach the engine.
# Size the machine here: a deploy applies this section and undoes any resize
# made in the Fly dashboard.
[[vm]]
  cpu_kind = 'performance'
  cpus = 1
  memory_mb = 2048
