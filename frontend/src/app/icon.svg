<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- PalTra: a rounded tile with a rising candle line, the P of the app in the corner. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#g)"/>
  <!-- candles -->
  <g stroke-linecap="round">
    <line x1="18" y1="22" x2="18" y2="46" stroke="#fda4af" stroke-width="2"/>
    <rect x="14" y="28" width="8" height="12" rx="1.5" fill="#f43f5e"/>
    <line x1="32" y1="18" x2="32" y2="44" stroke="#a7f3d0" stroke-width="2"/>
    <rect x="28" y="22" width="8" height="14" rx="1.5" fill="#10b981"/>
    <line x1="46" y1="10" x2="46" y2="34" stroke="#a7f3d0" stroke-width="2"/>
    <rect x="42" y="14" width="8" height="12" rx="1.5" fill="#10b981"/>
  </g>
  <!-- the SMA line -->
  <polyline points="10,44 24,38 38,30 54,16" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
</svg>
