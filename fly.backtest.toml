# The backtest server: replays (backtests) on their own machine, so a heavy backtest never
# slows the bots on `paltra`. Same image as the desk; PALTRA_ROLE=backtest refuses every order
# and LIVE switch and runs no live bots or scans (see backend/backtest_server.py).
# Setup steps: BACKTEST.md.
#
#   fly deploy -c fly.backtest.toml
#
# It runs only when used: opening the page starts the machine (auto_start_machines), and the
# app stops itself after its idle time (30 min by default, set on the page). Fly's own
# auto-stop stays off, because it would also stop a backtest still playing with no page open.

app = 'paltra-backtest'
primary_region = 'sin'
kill_timeout = '15s'

[build]

[env]
  PALTRA_ROLE = 'backtest'
  DESK_URL = 'https://paltra.fly.dev'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

# A clean exit (the idle stop) leaves the machine stopped; a crash restarts it.
[[restart]]
  policy = 'on-failure'
  retries = 5

# Own volume: the bots' settings copy, the backtest runs and their trades.
[[mounts]]
  source = 'backtest_data'
  destination = '/data'

# A dedicated (performance) core: backtests are CPU-heavy, and nothing else runs here.
[[vm]]
  cpu_kind = 'performance'
  cpus = 2
  memory_mb = 4096
