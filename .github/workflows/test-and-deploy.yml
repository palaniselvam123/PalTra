name: Test and deploy

# Every pull request and every push runs the tests.
#
# Two-step release (owner's choice, so the main desk never changes before a version is tried):
# 1. A push to main that passes the tests deploys to the BACKTEST SERVER only (paltra-backtest,
#    fly.backtest.toml), at any hour: that server never sends an order.
# 2. Once the version is checked there, "Run workflow" with target "main-desk" deploys it to the
#    MAIN DESK (paltra) and then the scanner. Paste the version the backtest server shows as
#    "commit" to ship exactly that one (blank = the latest main). Inside NSE market hours
#    (09:00-15:45 IST, Mon-Fri) the main desk is deployed only with "market_hours_ok" ticked,
#    because a restart drops the bots' in-memory state mid-session.
# Tests never place orders: they use fake brokers, PAPER mode, and no Groww credentials exist here.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to deploy: backtest = the backtest server; main-desk = the main desk (paltra) and the scanner"
        type: choice
        options: [backtest, main-desk]
        default: backtest
      commit:
        description: "Commit to deploy (the version the backtest server shows). Blank = the latest main."
        type: string
        default: ""
      market_hours_ok:
        description: "main-desk only: allow the deploy inside NSE market hours (09:00-15:45 IST). The desk restarts for about a minute."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.target || 'push' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A main-desk / backtest deploy by hand (workflow_dispatch) ships a commit that was already pushed to main, and that
  # push already ran the backend tests on that very commit. When it passed, they are not run a second time (about
  # 25-30 minutes saved); when it did not pass, or was never tested, they run here as usual.
  tested-before:
    name: Already tested on main?
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      passed: ${{ steps.look.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
      - id: look
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          sha=$(git rev-parse HEAD)
          passed=false
          runs=$(gh api "repos/$REPO/actions/workflows/test-and-deploy.yml/runs?head_sha=$sha&event=push&per_page=20" --jq '.workflow_runs[].id' || true)
          for run in $runs; do
            ok=$(gh api "repos/$REPO/actions/runs/$run/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name == "Backend tests" and .conclusion == "success")] | length' || echo 0)
            if [ "${ok:-0}" -gt 0 ]; then passed=true; echo "Backend tests passed on ${sha:0:7} in run $run."; break; fi
          done
          if [ "$passed" = true ]; then
            echo "::notice title=Tests not run again::${sha:0:7} already passed the backend tests when it was pushed to main."
          else
            echo "::notice title=Running the tests::No passing backend test run found for ${sha:0:7} on main, so they run now."
          fi
          echo "passed=$passed" >> "$GITHUB_OUTPUT"

  # The backend tests in 4 parts on 4 runners at once, each part on every CPU of its runner (pytest-xdist; a test
  # file stays on one worker, --dist loadfile). Test files are shared out by size, the biggest first, so the parts take
  # about the same time.
  backend-part:
    name: Backend tests (part ${{ matrix.part }} of 4)
    needs: [tested-before]
    if: ${{ !cancelled() && needs.tested-before.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: backend
    env:
      TRADING_MODE: PAPER
      SMA_TICK_SIZES: "off"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest (this part)
        env:
          PART: ${{ matrix.part }}
        run: |
          files=$(python ../scripts/test_parts.py 4 "$PART")
          echo "$(echo "$files" | wc -w) test files in part $PART"
          python -m pytest -q -n auto --dist loadfile $files

  # The one check named "Backend tests" (what the release gate and the deploy jobs wait on): every part passed, or the
  # commit already passed them on main.
  backend-tests:
    name: Backend tests
    needs: [tested-before, backend-part]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          BEFORE: ${{ needs.tested-before.outputs.passed }}
          PARTS: ${{ needs.backend-part.result }}
        run: |
          if [ "$BEFORE" = "true" ]; then echo "Already passed on main."; exit 0; fi
          if [ "$PARTS" = "success" ]; then echo "All parts passed."; exit 0; fi
          echo "::error title=Backend tests failed::Backend test parts: $PARTS"
          exit 1

  frontend-build:
    name: Frontend typecheck and export
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # The Dockerfile copies this static export into the image.
      - run: npm run build
        env:
          NEXT_OUTPUT: export
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: frontend-out
          path: frontend/out
          retention-days: 3

  release-gate:
    name: Release gate
    needs: [backend-tests, frontend-build]
    # !cancelled(): on a push "Already tested on main?" is skipped, and without a status function GitHub skips every
    # job after a skipped one, so the merge never deployed the backtest server.
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      && needs.backend-tests.result == 'success' && needs.frontend-build.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      backtest: ${{ steps.check.outputs.backtest }}
      desk: ${{ steps.check.outputs.desk }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          TARGET: ${{ inputs.target || 'backtest' }}
          MARKET_OK: ${{ inputs.market_hours_ok || false }}
          DEPLOY_BACKTEST: ${{ vars.DEPLOY_BACKTEST }}
        run: |
          version=$(git rev-parse HEAD)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          day=$(TZ=Asia/Kolkata date -d "${GATE_NOW:-now}" +%u)     # 1=Mon .. 7=Sun
          hhmm=$(TZ=Asia/Kolkata date -d "${GATE_NOW:-now}" +%H%M)
          clock=$(TZ=Asia/Kolkata date -d "${GATE_NOW:-now}" '+%a %d %b %H:%M IST')
          in_hours=false
          if [ "$day" -le 5 ] && [ "$((10#$hhmm))" -ge 900 ] && [ "$((10#$hhmm))" -le 1545 ]; then
            in_hours=true
          fi
          backtest=false
          desk=false
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$TARGET" = "main-desk" ]; then
            if [ "$in_hours" = true ] && [ "$MARKET_OK" != "true" ]; then
              msg="Main desk NOT deployed: $clock is inside NSE market hours (09:00-15:45 IST, Mon-Fri). Run again after 15:45, or tick market_hours_ok to deploy now (the desk restarts for about a minute)."
              echo "::error title=Main desk deploy refused (market hours)::$msg"
              echo "$msg" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            desk=true
            msg="Deploying ${version:0:7} to the MAIN DESK and the scanner at $clock."
            if [ "$in_hours" = true ]; then
              echo "::warning title=Main desk deploy during market hours::$msg (market_hours_ok ticked)"
            else
              echo "::notice title=Main desk deploy::$msg"
            fi
          else
            if [ "$DEPLOY_BACKTEST" != "true" ]; then
              msg="Nothing deployed: new versions go to the backtest server first, and the repo variable DEPLOY_BACKTEST is not true. Set it, or deploy with Run workflow → target main-desk."
              echo "::warning title=No backtest server::$msg"
            else
              backtest=true
              msg="Deploying ${version:0:7} to the BACKTEST SERVER at $clock. Check it there, then Run workflow → target main-desk (commit ${version:0:7}) to ship it to the main desk."
              echo "::notice title=Backtest server deploy::$msg"
            fi
          fi
          echo "backtest=$backtest" >> "$GITHUB_OUTPUT"
          echo "desk=$desk" >> "$GITHUB_OUTPUT"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

  # The backtest server (fly.backtest.toml, BACKTEST.md): every tested push to main lands here first.
  # Needs the repo variable DEPLOY_BACKTEST = "true" and the secret FLY_BACKTEST_API_TOKEN
  # (`fly tokens create deploy -a paltra-backtest`). Any hour: it never sends an order. A backtest
  # playing there is cut by the restart and can be resumed (Resume on the replay bar).
  deploy-backtest:
    name: Deploy backtest server to Fly.io
    needs: [backend-tests, frontend-build, release-gate]
    if: ${{ !cancelled() && needs.release-gate.result == 'success' && needs.release-gate.outputs.backtest == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    concurrency:
      group: fly-deploy-backtest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-gate.outputs.version }}
      - uses: actions/download-artifact@v4
        with:
          name: frontend-out
          path: frontend/out
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # Fly's builder first; if it fails or stalls, built on this runner and pushed directly (scripts/fly_deploy.sh).
      - name: flyctl deploy (backtest server; built on the runner if Fly's builder fails)
        run: scripts/fly_deploy.sh fly.backtest.toml "Backtest server"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_BACKTEST_API_TOKEN }}
          VERSION: ${{ needs.release-gate.outputs.version }}

  # The main desk (paltra): only by hand, Run workflow → target main-desk.
  deploy:
    name: Deploy main desk to Fly.io
    needs: [backend-tests, frontend-build, release-gate]
    if: ${{ !cancelled() && needs.release-gate.result == 'success' && needs.release-gate.outputs.desk == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    # One deploy at a time; a newer run waits instead of cancelling a rollout.
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-gate.outputs.version }}
      - uses: actions/download-artifact@v4
        with:
          name: frontend-out
          path: frontend/out
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # Builds the Dockerfile on Fly's builders and waits for the health check; if Fly's builder fails
      # or stalls, builds it on this runner and pushes it to Fly's registry directly (scripts/fly_deploy.sh).
      - name: flyctl deploy (main desk; built on the runner if Fly's builder fails)
        run: scripts/fly_deploy.sh "" "Main desk"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          VERSION: ${{ needs.release-gate.outputs.version }}

  # The scanner server (fly.scanner.toml, SCANNER.md), shipped with the main desk. Off until the repo
  # variable DEPLOY_SCANNER is "true" and the secret FLY_SCANNER_API_TOKEN
  # (`fly tokens create deploy -a paltra-scanner`) is set. After the desk's deploy, not beside it: both
  # build on the org's one remote Fly builder. It still runs when the desk's deploy failed (!cancelled).
  deploy-scanner:
    name: Deploy scanner to Fly.io
    needs: [backend-tests, frontend-build, release-gate, deploy]
    if: ${{ !cancelled() && needs.release-gate.outputs.desk == 'true' && vars.DEPLOY_SCANNER == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    concurrency:
      group: fly-deploy-scanner
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-gate.outputs.version }}
      - uses: actions/download-artifact@v4
        with:
          name: frontend-out
          path: frontend/out
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # A healthy deploy takes about a minute. If Fly's builder fails or stalls (stopped after 8 minutes),
      # the image is built on this runner and pushed to Fly's registry directly (scripts/fly_deploy.sh).
      - name: flyctl deploy (scanner; built on the runner if Fly's builder fails)
        run: scripts/fly_deploy.sh fly.scanner.toml "Scanner"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_SCANNER_API_TOKEN }}
          VERSION: ${{ needs.release-gate.outputs.version }}
