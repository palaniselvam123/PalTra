name: Test and deploy

# Every pull request and every push runs the tests. A push to main that passes
# them deploys to Fly.io, except inside NSE market hours (09:00-15:45 IST,
# Mon-Fri). "Run workflow" (workflow_dispatch) on main deploys at any time.
# Tests never place orders: they use fake brokers, PAPER mode, and no Groww
# credentials exist in this workflow.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      TRADING_MODE: PAPER
      SMA_TICK_SIZES: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  frontend-build:
    name: Frontend typecheck and export
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # The Dockerfile copies this static export into the image.
      - run: npm run build
        env:
          NEXT_OUTPUT: export
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: frontend-out
          path: frontend/out
          retention-days: 3

  market-hours-gate:
    name: Market-hours deploy gate
    needs: [backend-tests, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      # A restart while NSE is trading drops the bot's in-memory state and
      # quotes mid-session. Pushes to main inside 09:00-15:45 IST, Mon-Fri,
      # do not deploy. A manual "Run workflow" always may.
      - id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          day=$(TZ=Asia/Kolkata date -d "${GATE_NOW:-now}" +%u)     # 1=Mon .. 7=Sun
          hhmm=$(TZ=Asia/Kolkata date -d "${GATE_NOW:-now}" +%H%M)
          clock=$(TZ=Asia/Kolkata date -d "${GATE_NOW:-now}" '+%a %d %b %H:%M IST')
          in_hours=false
          if [ "$day" -le 5 ] && [ "$((10#$hhmm))" -ge 900 ] && [ "$((10#$hhmm))" -le 1545 ]; then
            in_hours=true
          fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            if [ "$in_hours" = true ]; then
              msg="Manual deploy at $clock, inside NSE market hours. Allowed because it was started by hand."
              echo "::warning title=Deploying during market hours::$msg"
            else
              msg="Manual deploy at $clock."
              echo "::notice title=Deploy allowed::$msg"
            fi
          elif [ "$in_hours" = true ]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            msg="Deploy skipped: $clock is inside NSE market hours (09:00-15:45 IST, Mon-Fri). Tests passed; nothing was deployed. Deploy after 15:45 with Actions > Test and deploy > Run workflow on main, or push again outside market hours."
            echo "::warning title=Deploy skipped (market hours)::$msg"
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            msg="Outside NSE market hours ($clock). Deploying."
            echo "::notice title=Deploy allowed::$msg"
          fi
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to Fly.io
    needs: [backend-tests, frontend-build, market-hours-gate]
    if: needs.market-hours-gate.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    environment: production
    # One deploy at a time; a newer push waits instead of cancelling a rollout.
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-out
          path: frontend/out
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # Builds the Dockerfile on Fly's builders and waits for the health check.
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
