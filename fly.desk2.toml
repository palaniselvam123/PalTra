# The second desk: a full copy of the main desk (desk + SMA terminal + bots) on its own Fly account,
# with its own volume, database, Groww key, settings and secrets. Same image as `paltra`. Setup: DESK2.md.
#
# CI deploys it with Run workflow → target desk2 (.github/workflows/test-and-deploy.yml). The app is
# `pritra`; CI passes the repo variable DESK2_APP with -a, so a different name created on the new
# account is used instead. By hand: fly deploy -c fly.desk2.toml

app = 'pritra'
primary_region = 'sin'
# Time to ring the owner and send the WhatsApp alert before a deploy stops the app.
kill_timeout = '15s'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

# Fly's default limit is 25 requests at once per machine; the pages poll many endpoints
# (state, chart, replay, scans) and a few open tabs passed it, so Fly's proxy queued or
# refused requests ("Can't reach the trading engine"). One uvicorn process serves them all.
[http_service.concurrency]
  type = 'requests'
  soft_limit = 200
  hard_limit = 250

[[mounts]]
  source = 'data'
  destination = '/data'

# Two dedicated performance CPUs and 4 GB, like fly.toml (owner's choice). The shared CPUs used first were
# throttled by Fly once their burst allowance ran out, and backtests then froze the desk for 5-20 s at a time.
# Performance machines need the account on Pay As You Go (the Free plan refuses them and the deploy fails).
[[vm]]
  cpu_kind = 'performance'
  cpus = 2
  memory_mb = 4096
