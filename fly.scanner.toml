# The scanner server: the Scalp page's scans and alerts on their own machine and
# their own Groww API key, so a heavy scan never slows or stops the bots on
# `paltra`. Same image as the desk; PALTRA_ROLE=scanner refuses every order and
# LIVE switch (see backend/server_role.py). Setup steps: SCANNER.md.
#
#   fly deploy -c fly.scanner.toml

app = 'paltra-scanner'
primary_region = 'sin'
kill_timeout = '15s'

[build]

[env]
  PALTRA_ROLE = 'scanner'
  DESK_URL = 'https://paltra.fly.dev'
  # Three stocks' candles at once (scan_worker.py: three worker processes that together keep
  # one Groww request per 0.35 s). This server has its own Groww key and no bots.
  CROSS_SCAN_CONCURRENCY = '3'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

# Own volume: its own Groww login (encrypted), alert channels and scan settings.
[[mounts]]
  source = 'scanner_data'
  destination = '/data'

# Measured: about 0.4 GB in use while scanning with one worker; each extra scan worker
# (CROSS_SCAN_CONCURRENCY) adds about 0.1 GB, so 1 GB still leaves headroom.
[[vm]]
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 1024
